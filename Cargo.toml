[package]
name = "melta"
version = "0.1.0"
edition = "2021"
description = "Tyggja の原本から、編集した版を作る道具"

[[bin]]
name = "melta"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
jsonschema = { version = "0.63.1", default-features = false }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
time = { version = "0.3.55", features = ["formatting", "local-offset"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3"
